<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Studiehulp — kies wat je wilt leren</title>
<style>
  :root{
    --ink:#18181b;--muted:#71717a;--line:#e4e4e7;--bg:#fafafa;--card:#ffffff;--hover:#f4f4f5;
    --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.6;
    -webkit-font-smoothing:antialiased}
  .wrap{max-width:880px;margin:0 auto;padding:0 20px}
  header{padding:64px 0 28px}
  header .kicker{font-size:13px;font-weight:600;color:var(--muted);margin:0 0 10px}
  header h1{margin:0;font-size:40px;line-height:1.1;letter-spacing:-.03em;font-weight:750}
  header p{margin:14px 0 0;font-size:17px;color:var(--muted);max-width:56ch}
  main{padding-bottom:64px}
  .bar{position:sticky;top:0;z-index:5;background:rgba(250,250,250,.88);
    -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);margin-bottom:32px}
  .bar .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding-top:12px;padding-bottom:12px}
  .jarenbar{display:inline-flex;background:var(--hover);border-radius:10px;padding:3px}
  .jaar{cursor:pointer;border:0;background:none;color:var(--muted);padding:6px 14px;border-radius:8px;
    font:inherit;font-size:14px;font-weight:600}
  .jaar.active{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
  .filterbar{display:flex;gap:4px;flex-wrap:wrap}
  .chip{cursor:pointer;border:0;background:none;color:var(--muted);padding:6px 12px;border-radius:8px;
    font:inherit;font-size:14px;font-weight:500}
  .chip:hover{background:var(--hover);color:var(--ink)}
  .chip.active{background:var(--ink);color:#fff}
  .jaar:focus-visible,.chip:focus-visible,a.card:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
  .toetsweek{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 20px}
  .vak{margin-bottom:44px}
  .vak-head{display:flex;align-items:center;gap:10px;margin-bottom:4px}
  .dot{width:10px;height:10px;border-radius:50%;flex:0 0 auto}
  .vak h2{margin:0;font-size:20px;font-weight:700;letter-spacing:-.02em}
  .vak .sub{font-size:14px;color:var(--muted);margin:0 0 0 20px}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin-top:16px}
  a.card{display:block;text-decoration:none;color:inherit;background:var(--card);
    border:1px solid var(--line);border-radius:12px;padding:16px 18px;
    transition:border-color .15s,box-shadow .15s}
  a.card:hover{border-color:#d4d4d8;box-shadow:0 4px 14px rgba(0,0,0,.06)}
  a.card .ch{font-size:12px;font-weight:600;color:var(--accent)}
  a.card h3{margin:2px 0 4px;font-size:16px;font-weight:650;letter-spacing:-.01em}
  a.card p{margin:0;font-size:14px;color:var(--muted);line-height:1.5}
  .soon{display:flex;align-items:center;justify-content:center;text-align:center;
    border:1px dashed var(--line);border-radius:12px;padding:16px;color:var(--muted);font-size:14px}
  @media (max-width:560px){header{padding-top:40px} header h1{font-size:32px}}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <p class="kicker">Studiehulp</p>
    <h1>Kies wat je wilt leren</h1>
    <p>Samenvattingen met begrippen en zelftoetsen. Kies een hoofdstuk om te beginnen.</p>
  </div>
</header>

<main>
  <div class="bar">
    <div class="wrap">
      <div class="jarenbar" id="jaren"></div>
      <div class="filterbar" id="filters"></div>
    </div>
  </div>
  <div class="wrap" id="vakken"></div>
</main>


<script>
/* =======================================================================
   HIER JAREN, TOETSWEKEN, VAKKEN & HOOFDSTUKKEN TOEVOEGEN
   - elk jaar heeft een lijst toetsweken; elke toetsweek een lijst vakken
   - naam van een toetsweek leeg ("") = geen kopje boven die vakken
   - kleur: hex-code voor het vak-accent
   - status "klaar" = klikbaar, "binnenkort" = grijze placeholder
   - vakken zonder hoofdstukken worden niet getoond
   ======================================================================= */
const JAREN = [
  {
    id: "jaar-4",
    naam: "Jaar 4",
    toetsweken: [
      {
        naam: "",
        vakken: [
          {
            naam: "Biologie",
            initiaal: "Bi",
            kleur: "#3c6e54",
            omschrijving: "VWO · Inleiding in de biologie & ecologie",
            hoofdstukken: [
              { code:"H5", titel:"Ecologie", omschrijving:"Ecosystemen, voedselrelaties, energie en successie.", link:"vakken/jaar-4/biologie/h5-ecologie.html", status:"klaar" },
              { code:"H6", titel:"Mens en milieu", omschrijving:"Kringlopen, eutrofiëring, broeikaseffect en duurzaamheid.", link:"vakken/jaar-4/biologie/h6-mens-en-milieu.html", status:"klaar" }
            ]
          },
          {
            naam: "Maatschappijleer",
            initiaal: "Ma",
            kleur: "#c47a2c",
            omschrijving: "VWO · Pluralist society",
            hoofdstukken: [
              { code:"2.1–2.4", titel:"The rule of law", omschrijving:"Rechtsstaat, trias politica, opsporing en het rechtssysteem.", link:"vakken/jaar-4/maatschappijleer/h2-rule-of-law.html", status:"klaar" },
              { code:"4.1–4.3", titel:"Pluralist society", omschrijving:"Cultuur, socialisatie, identiteit en hokjesdenken.", link:"vakken/jaar-4/maatschappijleer/h4-pluralist-society.html", status:"klaar" },
              { code:"4.4–4.6", titel:"Migration & change", omschrijving:"Migratie, integratie en de veranderende samenleving.", link:"vakken/jaar-4/maatschappijleer/h4-migration-and-change.html", status:"klaar" }
            ]
          },
          {
            naam: "Aardrijkskunde",
            initiaal: "Ak",
            kleur: "#4a77a8",
            omschrijving: "VWO · Actieve aarde & landschappen",
            hoofdstukken: [
              { code:"H1", titel:"Endogene processen", omschrijving:"Platentektoniek, gesteenten, vulkanisme en aardbevingen.", link:"vakken/jaar-4/aardrijkskunde/h1-endogene-processen.html", status:"klaar" },
              { code:"H2", titel:"Exogene processen", omschrijving:"Straling, circulatie, klimaten, verwering en erosie.", link:"vakken/jaar-4/aardrijkskunde/h2-exogene-processen.html", status:"klaar" },
              { code:"H3", titel:"Landschappen", omschrijving:"Geofactoren, landschapszones, degradatie en stroomgebieden.", link:"vakken/jaar-4/aardrijkskunde/h3-landschappen.html", status:"klaar" }
            ]
          },
          {
            naam: "Scheikunde",
            initiaal: "Sk",
            kleur: "#8a6d4a",
            omschrijving: "VWO · H6 Reacties in evenwicht",
            hoofdstukken: [
              { code:"6.1", titel:"Reactiesnelheid", omschrijving:"Botsende-deeltjesmodel, vijf factoren en activeringsenergie.", link:"vakken/jaar-4/scheikunde/6-1-reactiesnelheid.html", status:"klaar" },
              { code:"6.2", titel:"Molariteit", omschrijving:"Molariteit berekenen en concentratie van ionen in zouten.", link:"vakken/jaar-4/scheikunde/6-2-molariteit.html", status:"klaar" },
              { code:"6.3", titel:"Evenwichtsreacties", omschrijving:"Chemisch, oplos- en verdelingsevenwicht.", link:"vakken/jaar-4/scheikunde/6-3-evenwichtsreacties.html", status:"klaar" },
              { code:"6.4", titel:"Rekenen aan evenwichten", omschrijving:"Concentratiebreuk, K, BOE-tabel en oplosbaarheidsproduct.", link:"vakken/jaar-4/scheikunde/6-4-rekenen-aan-evenwichten.html", status:"klaar" },
              { code:"6.5", titel:"Evenwichten beïnvloeden", omschrijving:"Concentratie, druk, temperatuur en katalysator.", link:"vakken/jaar-4/scheikunde/6-5-evenwichten-beinvloeden.html", status:"klaar" }
            ]
          }
        ]
      }
    ]
  },
  {
    id: "jaar-5",
    naam: "Jaar 5",
    toetsweken: [
      {
        naam: "Toetsweek 1",
        vakken: [
          {
            naam: "Natuurkunde",
            initiaal: "Na",
            kleur: "#2a5340",
            omschrijving: "VWO · NOVA H1, H2, H3, H5",
            hoofdstukken: [
              { code:"H1", titel:"Bewegingen beschrijven", omschrijving:"Plaats, snelheid, versnelling, significante cijfers en vrije val.", link:"vakken/jaar-5/toetsweek-1/natuurkunde/h1-bewegingen-beschrijven.html", status:"klaar" },
              { code:"H2", titel:"Kracht en beweging", omschrijving:"Wetten van Newton, krachten samenstellen, ontbinden en evenwicht.", link:"vakken/jaar-5/toetsweek-1/natuurkunde/h2-kracht-en-beweging.html", status:"klaar" },
              { code:"H3", titel:"Energieomzettingen", omschrijving:"Arbeid, energiebehoud, warmte, rendement en vermogen.", link:"vakken/jaar-5/toetsweek-1/natuurkunde/h3-energieomzettingen.html", status:"klaar" },
              { code:"H5", titel:"Trillingen en golven", omschrijving:"Trillingen, resonantie, lopende en staande golven en interferentie.", link:"vakken/jaar-5/toetsweek-1/natuurkunde/h5-trillingen-en-golven.html", status:"klaar" }
            ]
          },
          {
            naam: "Engels",
            initiaal: "En",
            kleur: "#7a3b4c",
            omschrijving: "VWO · Terminology lists (IB5) · leren zoals in StudyGo",
            hoofdstukken: [
              { code:"Lijst 1", titel:"Photography", omschrijving:"12 terms: composition, salience, vectors, rule of thirds…", link:"vakken/jaar-5/toetsweek-1/engels/photography.html", status:"klaar" },
              { code:"Lijst 2", titel:"Literary Terms", omschrijving:"45 terms: plot, point of view, characters, irony, imagery…", link:"vakken/jaar-5/toetsweek-1/engels/literary-terms.html", status:"klaar" },
              { code:"Lijst 3", titel:"Film", omschrijving:"38 terms: shots, camera angles and movement, editing, sound…", link:"vakken/jaar-5/toetsweek-1/engels/film.html", status:"klaar" },
              { code:"Lijst 4", titel:"Cartoons & Comics", omschrijving:"21 terms: panels, gutter, emanata, speech bubbles…", link:"vakken/jaar-5/toetsweek-1/engels/cartoons-comics.html", status:"klaar" }
            ]
          }
        ]
      }
    ]
  }
];

/* ---- render (hier hoef je niets aan te passen) ---- */
const vakkenEl = document.getElementById('vakken');
const filtersEl = document.getElementById('filters');
const jarenEl = document.getElementById('jaren');
// standaard het nieuwste jaar; #jaar-4 in de url kiest een ander jaar
let jaar = JAREN.find(j=> "#"+j.id === location.hash) || JAREN[JAREN.length-1];
let actief = "Alle";

function maakJaren(){
  jarenEl.innerHTML = "";
  JAREN.forEach(j=>{
    const b = document.createElement('button');
    b.className = "jaar" + (j===jaar?" active":"");
    b.textContent = j.naam;
    b.onclick = ()=>{ jaar=j; actief="Alle"; history.replaceState(null,"","#"+j.id); maakJaren(); maakFilters(); render(); };
    jarenEl.appendChild(b);
  });
}

const heeftInhoud = v=> v.hoofdstukken.length > 0;

function maakFilters(){
  const vaknamen = new Set(jaar.toetsweken.flatMap(t=>t.vakken.filter(heeftInhoud).map(v=>v.naam)));
  const namen = ["Alle", ...vaknamen];
  filtersEl.innerHTML = "";
  namen.forEach(n=>{
    const c = document.createElement('button');
    c.className = "chip" + (n===actief?" active":"");
    c.textContent = n;
    c.onclick = ()=>{ actief=n; maakFilters(); render(); };
    filtersEl.appendChild(c);
  });
}

function render(){
  vakkenEl.innerHTML = "";
  jaar.toetsweken.forEach(t=>{
    const vakken = t.vakken.filter(v=> heeftInhoud(v) && (actief==="Alle" || v.naam===actief));
    if(vakken.length === 0) return;
    if(t.naam){
      const h = document.createElement('h2');
      h.className = "toetsweek";
      h.textContent = t.naam;
      vakkenEl.appendChild(h);
    }
    vakken.forEach(renderVak);
  });
}

function renderVak(v){
  const sec = document.createElement('section');
  sec.className = "vak";
  sec.style.setProperty('--accent', v.kleur);
  sec.innerHTML = `
    <div class="vak-head">
      <span class="dot" style="background:${v.kleur}"></span>
      <h2>${v.naam}</h2>
    </div>
    <p class="sub">${v.omschrijving}</p>`;
  const cards = document.createElement('div');
  cards.className = "cards";
  v.hoofdstukken.forEach(h=>{
    if(h.status === "klaar"){
      const a = document.createElement('a');
      a.className = "card";
      a.href = h.link;
      a.innerHTML = `<span class="ch">${h.code}</span><h3>${h.titel}</h3><p>${h.omschrijving}</p>`;
      cards.appendChild(a);
    } else {
      const d = document.createElement('div');
      d.className = "soon";
      d.innerHTML = `${h.code} · ${h.titel}<br><small>binnenkort</small>`;
      cards.appendChild(d);
    }
  });
  sec.appendChild(cards);
  vakkenEl.appendChild(sec);
}

maakJaren();
maakFilters();
render();
</script>
</body>
</html>
