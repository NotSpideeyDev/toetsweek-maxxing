  <p>The terms for analysing a photo or visual text. Look at what your eyes are drawn to first and explain why. Practise the terms at the bottom.</p>

<nav id="nav"></nav>

<main id="main"></main>
<footer>Terminology: Photography (IB5&amp;6). Name the technique, then the effect it has.</footer>

<script>
const TERMS = [
  ["Body language and gaze","Facial expressions, gestures, stance or position that convey the attitude, feelings or personality of the person shown. Also note the direction of the subject’s eyes."],
  ["Composition","What is included in the image is deliberately placed (this also applies to what is left out): surroundings, objects, clothing, etc."],
  ["Colour, hue and tone","In black-and-white images: the use of contrast, light and darkness. In colour images: colours signify feelings and evoke a response (e.g. red = passion, anger; blue = peace, coldness)."],
  ["Contrast","The arrangement of opposite elements (light and dark, large and small, rough and smooth) to create interest, excitement or drama."],
  ["Framing / Angle","The camera shots and angles, as in film: close-ups, extreme close-ups, medium shots, long shots, shots tilted up or down."],
  ["Omissions","What has been deliberately left out of the image."],
  ["Orientation / Point of view","Relates to framing and angle: is the viewer positioned above the image (looking down), below it, or at eye level?"],
  ["Positioning","Which objects are placed in the foreground, middle ground or background, and for what purpose."],
  ["Rule of thirds","Dividing an image into thirds from the top and sides to look at where people/objects are placed. The top third usually empowers; the bottom third disempowers."],
  ["Salience","The part of the visual your eyes are drawn to first (the focal point), determined by colour, image and layout."],
  ["Symbolism","The use of an image to represent one or more (often complex) ideas."],
  ["Vectors","The lines our eyes follow when looking at a visual; composers use them to direct our reading path (e.g. tall upright figures lead the eye upward → powerful)."]
];
</script>
