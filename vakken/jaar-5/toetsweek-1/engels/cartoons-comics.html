<script>
const TERMS = [
  ["Panel","A distinct segment of a comic containing a combination of image and text.","Layout"],
  ["Frame","The lines and borders that contain the panels.","Layout"],
  ["Gutter","The space between panels, where readers ‘read between the lines’ and imagine what happens.","Layout"],
  ["Bleed","An image that extends to and/or beyond the edge of the page.","Layout"],
  ["Foreground","The part of the panel closest to the viewer.","Layout"],
  ["Midground","The natural resting place for the eye, where the artist places the image a viewer will most likely look at first.","Layout"],
  ["Background","The back of the image, providing additional, subtextual information for the reader.","Layout"],
  ["Graphic weight","The way some images draw the eye more than others, using dark tones, high contrast, patterns or brilliant colours.","Layout"],
  ["Negative space","The areas between and around objects, which we tend to think of as empty.","Layout"],
  ["Emanata","Lines and squiggles coming from a character or object to show movement or a state of being.","Drawing techniques"],
  ["Symbolism","An image or object that represents a larger and more abstract idea.","Drawing techniques"],
  ["Exaggeration","Stretching the truth, hyperbole and caricature to emphasise key ideas or attributes.","Drawing techniques"],
  ["Facial expressions","How faces are portrayed: realistic like a portrait, or iconic (representing an idea or group of people).","Drawing techniques"],
  ["Open blank","A face drawn without much expression or detail, inviting the audience to imagine what the character feels.","Drawing techniques"],
  ["Hands / Feet","Their positioning expresses what is happening, e.g. raised palms = surprise, hands over mouth = fear or shame, turned-in feet = embarrassment.","Drawing techniques"],
  ["Punchline","Often the final line of a cartoon: the lasting joke or message, often ironic, that cements its meaning.","Text"],
  ["Text captions / Caption boxes","Boxes with text such as scene setting or description.","Text"],
  ["Speech bubbles","Shapes that enclose dialogue and come from a specific speaker’s mouth.","Text"],
  ["Thought bubble / Internal dialogue","A balloon holding a thought, with a series of dots or small bubbles leading up to it.","Text"],
  ["External dialogue","Speech between characters, shown in speech bubbles.","Text"],
  ["Lettering","A way of drawing attention to text, often highlighting onomatopoeia and words like ‘bang’ or ‘wow’.","Text"]
];
</script>
